[build-system]
requires = ["setuptools>=84.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hookstorm"
version = "0.1.0a1"
description = "A local-first webhook reliability and idempotency chaos-testing CLI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "HookStorm Contributors" }]
keywords = ["webhooks", "testing", "chaos-engineering", "http", "qa", "reliability", "idempotency", "standard-webhooks"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
]
dependencies = ["httpx>=0.27,<1", "PyYAML>=6.0.4,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10", "ruff>=0.6,<1", "build>=1.2,<2"]

[project.scripts]
hookstorm = "hookstorm.cli:main"

[project.urls]
Homepage = "https://github.com/blvxx/HookStorm"
Repository = "https://github.com/blvxx/HookStorm"
Issues = "https://github.com/blvxx/HookStorm/issues"
Changelog = "https://github.com/blvxx/HookStorm/blob/main/CHANGELOG.md"
PyPI = "https://pypi.org/project/hookstorm/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: webhook integration tests generated by HookStorm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

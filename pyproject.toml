[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hookstorm"
version = "0.1.0a1"
description = "A local-first webhook reliability and idempotency chaos-testing CLI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Артём Калинин", email = "enotzz@bk.ru" }]
keywords = ["webhooks", "testing", "chaos-engineering", "http", "qa", "reliability", "idempotency", "standard-webhooks"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
]
dependencies = ["httpx>=0.27,<1", "PyYAML>=6.0,<7", "idna>=3.6,<4"]

[project.optional-dependencies]
pytest = ["pytest>=8.0,<10"]
fastapi = ["fastapi>=0.115,<1"]
flask = ["Flask>=3.0,<4"]
docs = ["zensical>=0.1,<1"]

dev = [
  "build>=1.2,<2",
  "coverage[toml]>=7.6,<8",
  "mypy>=1.10,<2",
  "jsonschema>=4.21,<5",
  "types-PyYAML>=6.0,<7",
  "pytest>=8.0,<10",
  "ruff>=0.6,<1",
]

[project.scripts]
hookstorm = "hookstorm.cli:main"

[project.urls]
Homepage = "https://github.com/blvxx/HookStorm"
Repository = "https://github.com/blvxx/HookStorm"
Documentation = "https://github.com/blvxx/HookStorm/tree/main/docs"
Issues = "https://github.com/blvxx/HookStorm/issues"
Changelog = "https://github.com/blvxx/HookStorm/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hookstorm = ["py.typed", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: webhook integration tests generated by HookStorm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
files = ["src/hookstorm"]
mypy_path = "src"
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["hookstorm"]
parallel = false

[tool.coverage.report]
show_missing = true
skip_covered = true

name: Webhook scenario tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "examples/**"
      - ".github/workflows/webhook-scenarios.yml"
      - "pyproject.toml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "examples/**"
      - ".github/workflows/webhook-scenarios.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

# Keep baseline refreshes on main in a single ordered workflow run.
concurrency:
  group: webhook-scenarios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scenarios:
    runs-on: ubuntu-latest
    name: Local webhook integration scenarios
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install HookStorm
        run: python -m pip install .
      - name: Validate external CI example scenario
        run: hookstorm validate examples/ci/webhook-regression.yaml

      - name: Restore main-branch webhook baselines
        uses: actions/cache/restore@v4
        with:
          path: hookstorm-baselines/
          key: hookstorm-webhook-baselines-main-${{ github.sha }}
          restore-keys: |
            hookstorm-webhook-baselines-main-

      - name: Run and compare provider / delivery scenarios
        shell: bash
        env:
          HOOKSTORM_SECRET: hookstorm-ci-test-secret
        run: |
          set -uo pipefail
          mkdir -p test-results hookstorm-baselines
          history_db="test-results/history.sqlite3"

          python examples/receiver.py > test-results/receiver.log 2>&1 &
          receiver_pid=$!
          cleanup() {
            kill "$receiver_pid" 2>/dev/null || true
            wait "$receiver_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if python -c "import socket; s=socket.create_connection(('127.0.0.1', 8000), timeout=0.25); s.close()" 2>/dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            cat test-results/receiver.log
            echo "::error::Demo receiver did not start on 127.0.0.1:8000"
            exit 1
          fi

          is_main_push() {
            [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]
          }

          failed=0
          run_case() {
            scenario="$1"
            target="$2"
            name="$(basename "$scenario" .yaml)"
            baseline="hookstorm-baselines/${name}.json"
            echo "::group::${name}"

            if hookstorm run "$scenario" --target "$target" --format junit --output "test-results/${name}.xml" --history-db "$history_db"; then
              if [ -f "$baseline" ]; then
                if hookstorm history compare-file "$baseline" --db "$history_db" --latency-threshold-pct 1000; then
                  echo "Scenario ${name}: PASS · no regression"
                  if is_main_push; then
                    if ! hookstorm history export latest --output "$baseline" --db "$history_db"; then
                      echo "::error::Could not update baseline for ${name}"
                      failed=1
                    fi
                  fi
                else
                  code=$?
                  echo "::error::Scenario ${name} regression comparison failed with exit code ${code}"
                  failed=1
                fi
              else
                echo "Scenario ${name}: PASS · no baseline found yet; comparison will start after a successful main run"
                if is_main_push; then
                  if ! hookstorm history export latest --output "$baseline" --db "$history_db"; then
                    echo "::error::Could not initialize baseline for ${name}"
                    failed=1
                  fi
                fi
              fi
            else
              code=$?
              echo "::error::Scenario ${name} failed with exit code ${code}"
              failed=1
            fi
            echo "::endgroup::"
          }

          run_case examples/stripe-signature.yaml http://127.0.0.1:8000/webhook/signature/stripe
          run_case examples/github-signature.yaml http://127.0.0.1:8000/webhook/signature/github
          run_case examples/shopify-signature.yaml http://127.0.0.1:8000/webhook/signature/shopify
          export HOOKSTORM_SECRET='whsec_aG9va3N0b3JtLXN0YW5kYXJkLXdlYmhvb2tzLWRlbW8ta2V5LTMy'
          run_case examples/standard-webhooks.yaml http://127.0.0.1:8000/webhook/signature/standard
          run_case examples/standard-webhooks-stale-timestamp.yaml http://127.0.0.1:8000/webhook/signature/standard
          export HOOKSTORM_SECRET='hookstorm-ci-test-secret'
          run_case examples/invalid-signature.yaml http://127.0.0.1:8000/webhook/signature
          run_case examples/duplicate-delivery.yaml http://127.0.0.1:8000/webhook
          run_case examples/idempotency-verification.yaml http://127.0.0.1:8000/webhook
          run_case examples/commit-then-drop.yaml http://127.0.0.1:8000/webhook/commit-then-drop
          run_case examples/out-of-order.yaml http://127.0.0.1:8000/webhook
          run_case examples/payment-retry.yaml http://127.0.0.1:8000/webhook/flaky

          exit "$failed"

      - name: Save refreshed webhook baselines
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: hookstorm-baselines/
          key: hookstorm-webhook-baselines-main-${{ github.sha }}

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hookstorm-webhook-junit
          path: test-results/*.xml
          if-no-files-found: error
          retention-days: 14

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Static type check
        run: mypy
      - name: Prepare test result directory
        run: python -c "from pathlib import Path; Path('test-results').mkdir(exist_ok=True)"
      - name: Test
        run: coverage run -m pytest --junitxml=test-results/pytest.xml
      - name: Coverage report
        run: coverage report
      - name: Upload pytest JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pytest-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-results/pytest.xml
          if-no-files-found: error
          retention-days: 14
      - name: Build wheel and source distribution
        run: python -m build --sdist --wheel --outdir dist
      - name: Smoke-test installed wheel and source distribution
        run: python scripts/smoke_wheel.py --all

name: Bug report
description: Report a reproducible HookStorm problem
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include a minimal scenario and command. Remove secrets and customer data.
      render: yaml
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: HookStorm and Python versions
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
